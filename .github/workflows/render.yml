name: Render film

on:
  workflow_dispatch:
    inputs:
      start:
        description: first frame (0-based)
        default: "0"
      end:
        description: frame count (900 = 30 s)
        default: "900"
      publish_release:
        description: upload the MP4 as a release asset
        default: "true"
      voiceover_url:
        description: optional audio URL (mp3/wav) mixed over the film
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy imageio-ffmpeg

      - name: Render frames (parallel)
        run: |
          python tools/render_par.py ${{ inputs.start }} ${{ inputs.end }}

      - name: Fetch voice-over
        if: ${{ inputs.voiceover_url != '' }}
        run: |
          curl -L "${{ inputs.voiceover_url }}" -o voiceover.mp3
          ls -lh voiceover.mp3

      - name: Mux to MP4
        run: |
          python tools/mux.py --frames frames --out out \
            ${{ inputs.voiceover_url != '' && '--audio voiceover.mp3' || '' }}
          ls -lh out

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: why-is-the-sky-blue-mp4
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: film-${{ github.run_number }}
        run: |
          gh release create "$TAG" out/*.mp4 \
            --repo "${{ github.repository }}" \
            --title "Why Is The Sky Blue — $TAG" \
            --notes "Automated render: frames ${{ inputs.start }}–${{ inputs.end }} at 30 fps, 1080x1920." \
            --latest || {
              gh release upload "$TAG" out/*.mp4 --clobber --repo "${{ github.repository }}";
            }
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes  \(.url)"'
