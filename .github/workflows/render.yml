name: Render film

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      start:
        description: first frame (0-based)
        default: "0"
      end:
        description: frame count (900 = 30 s)
        default: "900"
      audio:
        description: mix the voice-over checked into the repo
        type: boolean
        default: true
      publish_release:
        description: publish the MP4 as a GitHub Release asset
        type: boolean
        default: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render frames (parallel)
        run: python tools/render_par.py "${{ inputs.start }}" "${{ inputs.end }}"

      - name: Mux to MP4
        run: |
          if [ "${{ inputs.audio }}" = "true" ]; then
            python tools/mux.py --frames frames --out out --audio voiceover.mp3
          else
            python tools/mux.py --frames frames --out out
          fi
          ls -lh out

      - name: Probe the master
        run: |
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          "$FF" -hide_banner -i out/why-is-the-sky-blue.mp4 2>&1 | grep -E "Duration|Stream" || true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: why-is-the-sky-blue-mp4
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: film-${{ github.run_number }}
        run: |
          set -e
          gh release create "$TAG" out/why-is-the-sky-blue.mp4 out/why-is-the-sky-blue-share.mp4 \
            --repo "${{ github.repository }}" \
            --title "Why Is The Sky Blue — $TAG" \
            --notes "1080x1920 · 30 fps · ${GITHUB_RUN_NUMBER} · frames ${{ inputs.start }}–${{ inputs.end }}" \
            --latest
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes  \(.url)"'
