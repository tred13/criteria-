name: Game check

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: how many seconds of gameplay to capture
        default: "20"

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.4.1 + Xvfb + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg unzip wget > /dev/null
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Import the project headlessly
        working-directory: godot/game
        run: |
          godot --headless --import --path . 2>&1 | tail -20
          echo "--- import exit: $?"

      - name: Boot the game headless (script errors surface here)
        working-directory: godot/game
        run: |
          set +e
          timeout 30 godot --headless --path . --quit-after 240 -- --autopilot 2>&1 | tee /tmp/boot.log
          grep -qiE "SCRIPT ERROR|Parse Error|Invalid call|Cannot open" /tmp/boot.log && { echo "GAME FAILED"; exit 1; }
          echo "boot clean"

      - name: Capture gameplay under Xvfb
        working-directory: godot/game
        run: |
          set -e
          Xvfb :99 -screen 0 960x540x24 &
          sleep 2
          export DISPLAY=:99
          godot --path . --resolution 960x540 -- --autopilot &
          GPID=$!
          sleep 3
          ffmpeg -y -loglevel error -f x11grab -video_size 960x540 -framerate 30 \
                 -i :99.0 -t "${{ inputs.seconds }}" -pix_fmt yuv420p -c:v libx264 \
                 gameplay.mp4
          kill $GPID || true
          ls -lh gameplay.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: rayleigh-run-gameplay
          path: godot/game/gameplay.mp4
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="game-${{ github.run_number }}"
          gh release create "$TAG" godot/game/gameplay.mp4 \
            --repo "${{ github.repository }}" \
            --title "Rayleigh Run — $TAG" \
            --notes "Automated gameplay capture: ${{ inputs.seconds }} s of the pixel platformer running in Godot 4.4.1 under Xvfb." \
            --latest
