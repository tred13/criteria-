name: publish-render
# نقل artifact موجود من run سابق إلى GitHub Release لتنزيله (ليس رندرًا).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'رقم run الرندر الناجح'
        required: true
      tag:
        description: 'اسم الوسم/الإصدار'
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shot
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: List and checksum
        run: |
          ls -l out
          md5sum out/*
      - name: Create release with the file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" out/* --repo "${{ github.repository }}" --title "${{ inputs.tag }}" --notes "Render artifact transfer from run ${{ inputs.run_id }} (not a render)."
